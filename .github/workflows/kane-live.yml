name: Real Kane verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a real TestMu account
        env:
          KANE_OAUTH_PROFILE: ${{ secrets.KANE_OAUTH_PROFILE }}
        shell: bash
        run: |
          if [[ -z "$KANE_OAUTH_PROFILE" && ( -z "$LT_USERNAME" || -z "$LT_ACCESS_KEY" ) ]]; then
            echo 'Configure a temporary KANE_OAUTH_PROFILE or LT_USERNAME and LT_ACCESS_KEY. No test has run.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @testmuai/kane-cli@0.10.9
      - name: Authenticate
        env:
          KANE_OAUTH_PROFILE: ${{ secrets.KANE_OAUTH_PROFILE }}
        shell: bash
        run: |
          if [[ -n "$KANE_OAUTH_PROFILE" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          bundle = json.loads(os.environ['KANE_OAUTH_PROFILE'])
          credentials = bundle['credentials']
          assert 'refresh_token' not in credentials, 'Transfer only the short-lived access token.'
          print('::add-mask::' + credentials['access_token'])
          root = Path.home() / '.testmuai/kaneai'
          for filename, data in {
              'config.json': bundle['config'],
              'profiles/default/prod/profile-config.json': bundle['profile'],
              'profiles/default/prod/credentials': credentials,
          }.items():
              path = root / filename
              path.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              path.write_text(json.dumps(data))
              path.chmod(0o600)
          PY
          else
            kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          fi
          kane-cli whoami
          kane-cli balance
      - name: Start disposable app
        run: |
          python demo/serve.py > /tmp/skillforge-demo.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/skillforge-demo.log
          exit 1
      - name: Freeze and generate a deliberately incorrect candidate
        run: |
          python forge.py doctor
          python forge.py create examples/ship-order.contract.json
          python forge.py author dispatch-ship-order --objective examples/wrong-objective.md
      - name: Require the incorrect procedure to fail independent acceptance
        shell: bash
        run: |
          set +e
          python forge.py verify dispatch-ship-order --values examples/first-request.json > wrong-result.json
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import json
          result = json.load(open('wrong-result.json'))
          assert result['action']['passed'] is True, 'The procedure must actually execute; infrastructure failure is not the demo.'
          assert result['analysis']['passed'] is False
          assert any(v is False for v in result['analysis']['completion']['condition_results'])
          PY
          python forge.py repair dispatch-ship-order > repair-context.json
      - name: Verify corrected procedure and persist the skill
        run: |
          python forge.py author dispatch-ship-order --objective examples/ship-order.objective.md
          python forge.py verify dispatch-ship-order --values examples/first-request.json > verified-result.json
          python forge.py find shipping
      - name: Reuse in a fresh process with a different order
        run: python forge.py run dispatch-ship-order --values examples/reuse-request.json > reused-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kane-evidence
          include-hidden-files: true
          path: |
            .skillforge/
            wrong-result.json
            repair-context.json
            verified-result.json
            reused-result.json
          retention-days: 7
